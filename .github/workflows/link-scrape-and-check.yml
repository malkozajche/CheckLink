name: Link Scrape and Check

on:
  push:
    branches:
      - main

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install

      - name: Run Link Scraper
        run: |
          node link-scraper.js --wait 2000 --debug --selectors "a[href], link[href]" --normalize-url "https://sapsupport.example.com/docs"
        env:
          NODE_ENV: production

      - name: Check links
        run: |
          npx linkinator './scraped-links/**/*.html' --quiet --retry 3 --timeout 5000

      - name: Cleanup
        run: |
          rm -rf ./scraped-links
