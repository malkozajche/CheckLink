# Updated Crawler Script

const puppeteer = require('puppeteer');

async function crawl(url) {
    const browser = await puppeteer.launch();
    const page = await browser.newPage();

    // Improved wait strategy for loading content
    await page.goto(url, { waitUntil: 'networkidle2', timeout: 0 });
    await page.waitForTimeout(2000);

    // Better link discovery techniques
    const links = await page.evaluate(() => {
        const elements = document.querySelectorAll('a');
        return Array.from(elements).map(element => element.href);
    });

    console.log('Found links:', links);

    // Normalizing URLs for SAP documentation
    const normalizedLinks = links.map(link => normalizeUrl(link));
    console.log('Normalized links:', normalizedLinks);

    // Filtering out unwanted links with more comprehensive logic
    const filteredLinks = normalizedLinks.filter(link => isValidLink(link));
    console.log('Filtered links:', filteredLinks);

    await browser.close();
    return filteredLinks;
}

