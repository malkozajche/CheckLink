# .github/workflows/link-scrape-and-check.yml
name: Link scrape & check (SQLScript subtree)

on:
  workflow_dispatch:
    inputs:
      start_url:
        description: Start URL (root of subtree)
        required: true
        default: https://help.sap.com/docs/hana-cloud-database/sap-hana-cloud-sap-hana-sqlscript-reference/
      prefix_regex:
        description: Regex to keep crawl inside subtree
        required: true
        default: ^https://help\.sap\.com/docs/hana-cloud-database/sap-hana-cloud-sap-hana-sqlscript-reference/
      max_depth:
        description: Link depth (3–7)
        required: true
        default: "6"
      max_pages:
        description: Max pages to visit (safety)
        required: true
        default: "2000"

jobs:
  crawl_and_check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and dependencies
        run: |
          npm install playwright@1.46.0
          npx playwright install chromium
          npx playwright install-deps chromium

      - name: Write crawler script
        shell: bash
        run: |
          cat > crawler.mjs << 'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          
          const startUrl = process.argv[2];
          const prefixPattern = process.argv[3];
          const maxDepth = parseInt(process.argv[4] || '6', 10);
          const maxPages = parseInt(process.argv[5] || '2000', 10);

          if (!startUrl || !prefixPattern) {
            console.error('Missing required arguments: startUrl and prefixPattern');
            process.exit(1);
          }

          let prefixRe;
          try {
            prefixRe = new RegExp(prefixPattern);
          } catch (error) {
            console.error('Invalid regex pattern:', error.message);
            process.exit(1);
          }

          const normalize = (u) => {
            try { 
              const url = new URL(u); 
              url.hash = ''; 
              return url.href; 
            } catch { 
              return null; 
            }
          };
          
          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          (async () => {
            let browser;
            let page;
            const listOut = 'all-urls.txt';
            
            console.log(`Starting crawl from: ${startUrl}`);
            console.log(`Prefix regex: ${prefixPattern}`);
            console.log(`Max depth: ${maxDepth}, Max pages: ${maxPages}`);
            
            try {
              console.log('Launching browser...');
              browser = await chromium.launch({ 
                headless: true, 
                args: [
                  '--disable-blink-features=AutomationControlled',
                  '--disable-dev-shm-usage',
                  '--no-sandbox',
                  '--disable-setuid-sandbox',
                  '--disable-web-security'
                ]
              });
              
              const context = await browser.newContext({ 
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
                viewport: { width: 1280, height: 720 },
                ignoreHTTPSErrors: true
              });
              
              page = await context.newPage();
              console.log('Browser launched successfully');

              const start = normalize(startUrl);
              if (!start) {
                throw new Error('Invalid start URL');
              }
              
              const queue = [{ url: start, depth: 0 }];
              const seen = new Set();

              while (queue.length && seen.size < maxPages) {
                const { url, depth } = queue.shift();
                
                if (!url || seen.has(url)) continue;
                if (!prefixRe.test(url)) continue;
                
                seen.add(url);
                console.log(`Crawling (${seen.size}/${maxPages}, depth ${depth}): ${url}`);
                
                try {
                  await page.goto(url, { 
                    waitUntil: 'domcontentloaded', 
                    timeout: 30000 
                  });
                  await sleep(500);
                  
                  const hrefs = await page.$$eval('a[href]', links => 
                    links.map(link => link.getAttribute('href')).filter(Boolean)
                  );
                  
                  for (const href of hrefs) {
                    try {
                      const abs = normalize(new URL(href, url).href);
                      if (!abs || seen.has(abs) || !prefixRe.test(abs)) continue;
                      if (depth + 1 <= maxDepth) {
                        queue.push({ url: abs, depth: depth + 1 });
                      }
                    } catch (e) {
                      continue;
                    }
                  }
                } catch (error) {
                  console.warn(`Failed to crawl ${url}: ${error.message}`);
                }
              }
              
              const sortedUrls = Array.from(seen).sort();
              fs.writeFileSync(listOut, sortedUrls.join('\n') + '\n');
              console.log(`Crawl complete. Found ${sortedUrls.length} URLs.`);
              
            } catch (error) {
              console.error('Crawler error:', error);
              try { 
                fs.writeFileSync('all-urls.txt', ''); 
              } catch {}
              process.exit(0);
            } finally {
              try { 
                if (page) await page.close();
                if (browser) await browser.close(); 
              } catch {}
            }
          })();
          EOF

      - name: Run crawler
        run: |
          node crawler.mjs \
            "${{ github.event.inputs.start_url }}" \
            "${{ github.event.inputs.prefix_regex }}" \
            "${{ github.event.inputs.max_depth }}" \
            "${{ github.event.inputs.max_pages }}"

      - name: Validate crawl results
        run: |
          if [ -f all-urls.txt ]; then
            URL_COUNT=$(wc -l < all-urls.txt)
            echo "Discovered URLs: $URL_COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$URL_COUNT" -eq 0 ]; then
              echo "Warning: No URLs were discovered during crawling" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Discovered URLs: 0" >> $GITHUB_STEP_SUMMARY
            echo "Error: Crawler did not produce output file" >> $GITHUB_STEP_SUMMARY
            touch all-urls.txt
          fi

      - name: Upload URL list
        uses: actions/upload-artifact@v4
        with:
          name: all-urls-${{ github.run_id }}
          path: all-urls.txt
          retention-days: 30

      - name: Install linkinator
        run: npm install -g linkinator

      - name: Link check each discovered page
        run: |
          echo "sourceUrl,status,state,finalUrl" > link-report.csv
          
          if [ ! -s all-urls.txt ]; then
            echo "No URLs to check - skipping link validation"
            exit 0
          fi
          
          TOTAL_URLS=$(wc -l < all-urls.txt)
          CURRENT=0
          
          while IFS= read -r URL || [ -n "$URL" ]; do
            [ -z "$URL" ] && continue
            
            CURRENT=$((CURRENT + 1))
            echo "Checking link $CURRENT/$TOTAL_URLS: $URL"
            
            # Run linkinator with error handling
            if linkinator "$URL" \
              --timeout 15000 \
              --concurrency 2 \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              --skip "^(mailto:|tel:)" \
              --skip "#|javascript:void" \
              --format csv > temp_report.csv 2>/dev/null; then
              # Skip the header line and append to main report
              tail -n +2 temp_report.csv >> link-report.csv || true
            else
              echo "Warning: Link check failed for $URL" >&2
            fi
            
            # Clean up temp file
            rm -f temp_report.csv
            
            # Small delay to be respectful to the server
            sleep 1
          done < all-urls.txt
          
          echo "Link checking complete"

      - name: Generate summary report
        run: |
          if [ -f link-report.csv ] && [ -s link-report.csv ]; then
            TOTAL_LINKS=$(wc -l < link-report.csv)
            # Account for header line
            TOTAL_LINKS=$((TOTAL_LINKS - 1))
            BROKEN_LINKS=$(grep -c ",BROKEN," link-report.csv || echo "0")
            
            echo "## Link Check Summary" >> $GITHUB_STEP_SUMMARY
            echo "- Total links checked: $TOTAL_LINKS" >> $GITHUB_STEP_SUMMARY
            echo "- Broken links found: $BROKEN_LINKS" >> $GITHUB_STEP_SUMMARY
            
            if [ "$BROKEN_LINKS" -gt 0 ]; then
              echo "### Broken Links:" >> $GITHUB_STEP_SUMMARY
              grep ",BROKEN," link-report.csv | head -10 >> $GITHUB_STEP_SUMMARY || true
              if [ "$BROKEN_LINKS" -gt 10 ]; then
                echo "... and $(($BROKEN_LINKS - 10)) more (see full report)" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "No link report generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload link report
        uses: actions/upload-artifact@v4
        with:
          name: link-report-${{ github.run_id }}
          path: link-report.csv
          retention-days: 30
